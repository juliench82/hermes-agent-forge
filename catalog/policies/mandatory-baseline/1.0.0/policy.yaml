apiVersion: hermes.platform/v1
kind: MandatoryPolicy
metadata: {id: mandatory-baseline, version: 1.0.0}
enforcement: non_overridable
requirements:
  server: {nonRootUser: true, sshKeyOnly: true, permitRootLogin: false, fail2ban: true, firewallDefaultDenyIncoming: true}
  agents: {leastPrivilege: true, readOnlyFilesystem: true, networkDefaultDeny: true, auditEveryToolCall: true}
  secrets: {plaintextInGit: forbidden, providerRequired: true}
  irreversibleActions: {confirmationRequired: true}
