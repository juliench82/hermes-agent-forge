# IMAP/SMTP Connector Primitive
# Aligned with Hermes MCP server definitions
# See: https://hermes-agent.nousresearch.com/docs/user-guide/features/mcp

mcp_server:
  name: imap-smtp-connector
  type: stdio
  command: npx
  args:
    - "-y"
    - "@modelcontextprotocol/server-email"
    - "imap"
    - "-s"
    - "smtp"
  env:
    - IMAP_HOST
    - IMAP_PORT
    - IMAP_USER
    - IMAP_PASSWORD
    - SMTP_HOST
    - SMTP_PORT
    - SMTP_USER
    - SMTP_PASSWORD

tools:
  - name: read_email
    description: Read emails from IMAP inbox
  - name: send_email
    description: Send emails via SMTP

security:
  credential_keys:
    - IMAP_PASSWORD
    - SMTP_PASSWORD
  require_approval_for:
    - send_email
