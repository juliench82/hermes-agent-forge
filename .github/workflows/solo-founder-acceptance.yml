name: Solo-founder acceptance (Sprint 8)

on:
  push:
    paths:
      - "compiler/first_interaction.py"
      - "compiler/activation.py"
      - "examples/solo-founder-saas.acceptance.json"
      - "tests/test_solo_founder_acceptance.py"
      - ".github/workflows/solo-founder-acceptance.yml"
  pull_request:
    paths:
      - "compiler/first_interaction.py"
      - "compiler/activation.py"
      - "examples/solo-founder-saas.acceptance.json"
      - "tests/test_solo_founder_acceptance.py"
      - ".github/workflows/solo-founder-acceptance.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m unittest tests.test_solo_founder_acceptance
