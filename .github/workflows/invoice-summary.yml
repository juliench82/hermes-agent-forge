name: Invoice summary pack

on:
  pull_request:
    paths:
      - "packs/invoice-summary/**"
      - ".github/workflows/invoice-summary.yml"
  push:
    branches:
      - main
    paths:
      - "packs/invoice-summary/**"
      - ".github/workflows/invoice-summary.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python packs/invoice-summary/run.py --test
