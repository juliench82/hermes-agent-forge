name: Hermes adapter compatibility

on:
  push:
    paths: ["compiler/hermes_adapter.py", "examples/solo-founder-app-builder.tenant-spec.json", "profiles/**", "shared/**", "runtime/**", "tests/test_hermes_adapter.py", ".github/workflows/hermes-adapter.yml"]
  pull_request:
    paths: ["compiler/hermes_adapter.py", "examples/solo-founder-app-builder.tenant-spec.json", "profiles/**", "shared/**", "runtime/**", "tests/test_hermes_adapter.py", ".github/workflows/hermes-adapter.yml"]

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install --disable-pip-version-check jsonschema==4.23.0
      - run: python -m unittest tests.test_hermes_adapter
      - run: python -m compiler validate examples/solo-founder-app-builder.tenant-spec.json
