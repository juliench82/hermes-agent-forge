name: TenantSpec contracts
on:
  push:
    paths: ["schemas/**", "catalog/**", "runtime/tenant_spec.py", "examples/*.tenant-spec.json", "tests/test_tenant_spec.py", ".github/workflows/tenant-spec.yml"]
  pull_request:
    paths: ["schemas/**", "catalog/**", "runtime/tenant_spec.py", "examples/*.tenant-spec.json", "tests/test_tenant_spec.py", ".github/workflows/tenant-spec.yml"]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install --disable-pip-version-check jsonschema==4.23.0
      - run: python -m unittest tests.test_tenant_spec
      - run: python -m runtime.tenant_spec examples/invoice-collections.tenant-spec.json
