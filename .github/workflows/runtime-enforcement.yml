name: Runtime enforcement (Sprint 3)

on:
  push:
    paths:
      - "runtime/**"
      - "tests/test_runtime_enforcement.py"
      - ".github/workflows/runtime-enforcement.yml"
  pull_request:
    paths:
      - "runtime/**"
      - "tests/test_runtime_enforcement.py"
      - ".github/workflows/runtime-enforcement.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m unittest tests.test_runtime_enforcement
