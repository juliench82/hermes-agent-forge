# Hermes Onboarding Loop v3.0 — Peer Messaging + Cron Follow-ups + Parallel Delegation
# Run: hermes -p default skills install onboarding-loop team-designer
# Then: hermes -p default chat "/goal Start onboarding"

name: onboarding-loop
version: 3.0.0
description: Enterprise onboarding with cross-machine peer messaging, scheduled cron follow-ups, and parallel profile creation via delegate_task

context:
  use_case: ""
  user_role: ""
  goals_raw: ""
  team_json: {}
  adjustments: ""
  buzz_optional: true
  usage_file: "/tmp/onboarding-usage.json"
  kanban_board: "onboarding-workflow"
  peer_gateway: ""
  cron_followup: "hermes cron create \"Check if user has started using their team\" --skill onboarding-followup --delivery telegram --schedule '0 10 * * 1'"

steps:
  - name: create_kanban_board
    action: shell
    command: >
      hermes kanban create "Onboard new user: {{context.use_case}}"
      --assignee orchestrator
      --goal
    store: context.kanban_id

  - name: welcome
    action: chat
    prompt: |
      Welcome to Hermes Team Setup.

      I'll help you build a multi-agent team tailored to your goals.
      This will create 3–7 specialist bots (Bot Mode) with their own roles, skills, and memory.

      **Kanban board created:** {{context.kanban_id}}

      Let's start: **What would you like to accomplish with Hermes?**
      (e.g., "Launch a music album", "Run an e-commerce store", "Automate client onboarding")
    store: context.use_case

  - name: collect_role
    action: chat
    prompt: |
      Great. Next: **What's your role in this project?**
      (e.g., "Founder", "Lead singer", "Solo consultant", "Marketing manager")
    store: context.user_role

  - name: collect_goals
    action: chat
    prompt: |
      Now list **3–5 main goals** (one per line). Be specific.

      Examples:
      - Release album on Spotify/Apple Music
      - Grow Instagram to 10k followers in 90 days
      - Book 5–10 live shows
      - Sell €5k in merchandise

      Your goals:
    store: context.goals_raw

  - name: design_team
    action: shell
    command: >
      hermes -z "Design a multi-agent team for: Use case={{context.use_case}}, Role={{context.user_role}}, Goals={{context.goals_raw}}. Output JSON with 3-7 profiles array."
      --usage-file {{context.usage_file}}
    store: context.team_raw

  - name: parse_team_json
    action: skill
    skill: json-parser
    input:
      text: "{{context.team_raw}}"
    store: context.team_json

  - name: validate_team_size
    action: if
    condition: "{{context.team_json.profiles | length >= 3 and context.team_json.profiles | length <= 7}}"
    then:
      - goto: validate_team_content
    else:
      - action: chat
        prompt: |
          I need 3–7 profiles. Here's what I got:

          {{context.team_json | to_yaml}}

          Can you adjust the team (add/remove/merge roles) so it's 3–7 profiles?
          Or say "regenerate" to try again.
        store: context.team_json
      - goto: validate_team_size

  - name: validate_team_content
    action: if
    condition: "{{context.team_json.profiles | length > 0}}"
    then:
      - goto: confirm_team
    else:
      - action: chat
        prompt: "Something went wrong. Say 'regenerate' to try again."
        store: context.team_json
      - goto: design_team

  - name: confirm_team
    action: chat
    prompt: |
      Here's your proposed team:

      {% for p in context.team_json.profiles %}
      **{{p.name}}**
      - Role: {{p.description}}
      - Skills: {{p.skills | join(', ')}}

      {% endfor %}
      Want to adjust anything? (e.g., "rename X to Y", "add a data analyst", "remove merch-manager")
      Or say "create" to proceed.
    store: context.adjustments

  - name: branch_adjustments
    action: if
    condition: "{{context.adjustments != 'create' and context.adjustments != '' and 'create' not in context.adjustments}}"
    then:
      - action: chat
        prompt: |
          Got it. Applying your changes: "{{context.adjustments}}"

          For now, please confirm the updated team or say "create" to proceed.
        store: context.team_json
      - goto: confirm_team
    else:
      - goto: ask_buzz

  - name: ask_buzz
    action: chat
    prompt: |
      Team confirmed. Next: **Messaging**

      Your bots can talk to each other automatically (Bot Mode).
      For human access, you can connect a messenger later (Telegram, Discord, Slack, WhatsApp, Buzz, etc.).

      **Buzz** is Block's open-source human+agent workspace (Nostr-based).
      It's optional. Do you want to set up Buzz now?

      Reply:
      - "buzz" to set up Buzz
      - "skip" to skip and configure later
    store: context.buzz_choice

  - name: setup_buzz
    action: if
    condition: "{{context.buzz_choice == 'buzz'}}"
    then:
      - action: shell
        command: hermes gateway setup buzz
      - action: chat
        prompt: |
          Buzz gateway configured.
          Proceeding to profile creation...
    else:
      - action: chat
        prompt: |
          Skipped Buzz. You can add any messenger later.
          Proceeding to profile creation...

  - name: create_profiles_parallel
    action: skill
    skill: delegate_task
    input:
      tasks: "{% for p in context.team_json.profiles %}{{p.name}}:{{p.description}}:{{p.skills | join(',')}};{% endfor %}"
      worktree_isolation: true
      max_concurrent_children: 3
    store: context.profile_results

  - name: create_group_chat
    action: shell
    command: >
      hermes group-chat create team-main
      --members "{{context.team_json.profiles | map(attribute='name') | join(',')}}"
      --description "Main team coordination channel"

  - name: setup_peer_gateway
    action: if
    condition: "{{context.peer_gateway != ''}}"
    then:
      - action: shell
        command: hermes peer add teammate --url {{context.peer_gateway}} --key abc123
      - action: shell
        command: hermes peer dm teammate/orchestrator "Team setup complete for {{context.use_case}}"
    else:
      - action: chat
        prompt: "Skipped peer gateway setup. You can add peers later with `hermes peer add`."

  - name: setup_cron_followup
    action: shell
    command: >
      hermes cron create "Check if user has started using their team"
      --skill onboarding-followup
      --delivery telegram
      --schedule "0 10 * * 1"

  - name: send_completion_notification
    action: shell
    command: >
      hermes send --to default
      "✅ Team created successfully! You now have {{context.team_json.profiles | length}} bots:
      {% for p in context.team_json.profiles %}{{p.name}}{% if not loop.last %}, {% endif %}{% endfor %}.
      Run 'hermes bots' to see your roster."

  - name: completion
    action: chat
    prompt: |
      ✅ **Team created successfully!**

      You now have {{context.team_json.profiles | length}} bots:

      {% for p in context.team_json.profiles %}
      - `{{p.name}}`
      {% endfor %}

      **Next steps:**

      1. **View your team** (Bot Mode roster):
         ```bash
         hermes bots
         ```

      2. **View kanban board**:
         ```bash
         hermes kanban list
         ```

      3. **Chat with a specific bot**:
         ```bash
         hermes -p <bot-name> chat "Your task"
         ```

      4. **Add a messenger for human access** (optional):
         ```bash
         hermes gateway setup telegram
         hermes gateway setup discord
         hermes gateway setup buzz
         ```

      5. **Start working**:
         - Bots can @mention each other in group chat
         - Assign tasks via the orchestrator bot
         - Monitor progress in the kanban board

      **Advanced features:**
      - **Peer gateway:** {{context.peer_gateway | default('Not configured')}}
      - **Cron follow-up:** Weekly check-in scheduled (Mondays at 10am)
      - **Parallel creation:** Profiles created with worktree isolation

      **Usage tracking:** Token/cost breakdown saved to `{{context.usage_file}}`

      Want to customize anything or start your first task?
